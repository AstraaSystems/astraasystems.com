name: Static HTML Deployment Engine

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Grant explicit security clearances for high-priority edge deployments
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrency collisions by dropping stale, mid-flight runs safely
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize GitHub Pages Configuration
        uses: actions/configure-pages@v5

      - name: Compile and Bundle Static Workspace Assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Stream Live Assets to Production Edge Network
        id: deployment
        uses: actions/deploy-pages@v4
