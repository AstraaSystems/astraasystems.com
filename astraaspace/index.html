<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astraa OS</title>
    <style>
      * { box-sizing:border-box; margin:0; padding:0; }
      body {
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
        background:#ffffff; color:#0f172a; min-height:100vh;
      }
      #astraa-topbar {
        display:flex; align-items:center; justify-content:space-between;
        padding:14px 24px; background:#ffffff; border-bottom:1px solid #e2e8f0;
        position:sticky; top:0; z-index:50;
      }
      #astraa-topbar .brand { font-weight:900; font-size:1.15rem; color:#03050a; letter-spacing:-0.02em; }
      #astraa-topbar .right { display:flex; align-items:center; gap:14px; }
      #tool-select {
        padding:10px 14px; border-radius:10px; border:1px solid #e2e8f0;
        background:#f8fafc; color:#0f172a; font-size:0.95rem; font-weight:600; min-width:240px; cursor:pointer;
      }
      #tool-select:focus { outline:none; border-color:#1d4ed8; box-shadow:0 0 0 3px rgba(29,78,216,0.12); }
      #logout-btn { background:transparent; border:none; color:#dc2626; cursor:pointer; font-size:0.8rem; font-weight:700; }
      #astraa-workspace { padding:40px 24px; max-width:1100px; margin:0 auto; }
      #welcome-title { font-size:clamp(1.6rem,3vw,2.4rem); font-weight:900; letter-spacing:-0.03em; color:#03050a; }
      #welcome-subtitle { color:#64748b; margin:6px 0 28px; font-size:0.9rem; font-weight:600; }
      #content-area h3 { font-size:1.4rem; font-weight:800; color:#0f172a; margin-bottom:10px; }
      #content-area p { color:#475569; }
      #content-area label { display:block; font-weight:700; font-size:0.85rem; color:#0f172a; margin-bottom:4px; }
      #content-area input, #content-area select {
        width:100%; padding:11px 13px; border:1px solid #e2e8f0; border-radius:8px;
        background:#f8fafc; color:#0f172a; font-size:0.95rem; font-family:inherit;
      }
      #content-area input:focus, #content-area select:focus { outline:none; border-color:#1d4ed8; box-shadow:0 0 0 3px rgba(29,78,216,0.12); }
      #content-area button { background:#1d4ed8; }
      #content-area a { color:#1d4ed8; font-weight:700; }
    </style>

<style id="astraa-polish-v1">
  body { background:#f1f5f9 !important; }
  #astraa-topbar { box-shadow:0 1px 3px rgba(15,23,42,0.06); }
  #astraa-workspace { max-width:1180px; margin:0 auto; padding:28px 24px 60px; }
  /* When a full workspace tool (Business) is active, collapse the welcome heading */
  body.astraa-workspace-active #welcome-title,
  body.astraa-workspace-active #welcome-subtitle { display:none !important; }
  body.astraa-workspace-active #astraa-workspace { max-width:100%; padding:0; }
  /* Business workspace should fill nicely */
  .bw-shell { min-height: calc(100vh - 62px) !important; border:none !important; border-radius:0 !important; box-shadow:none !important; }
</style>
</head>
<body>
    <div id="astraa-topbar">
        <div class="brand">Astraa OS</div>
        <div class="right">
            <select id="tool-select"><option value="">Select a tool…</option></select>
            <button id="logout-btn" onclick="logoutAstraa()">LOGOUT</button>
        </div>
    </div>
    <div id="astraa-workspace">
        <h1 id="welcome-title"></h1>
        <p id="welcome-subtitle"></p>
        <div id="content-area"></div>
    </div>
    <script>window.ASTRAA_API_BASE = "https://family-speed-outcome.ngrok-free.dev";</script>
    <script src="astraa_blueprint.js?v=1784226177"></script>
    <script src="dashboard_overview.js?v=1784226177"></script>
    <script src="module_commerce.js?v=1784226177"></script>
    <script src="auth.js?v=1784226177"></script>

    <script src="module_estimator.js?v=1784226177"></script>
    <script src="module_quote.js?v=1784226177"></script>
    <script src="module_project_doc.js?v=1784226177"></script>
    <script src="module_expense.js?v=1784226177"></script>
    <script src="module_business.js?v=1784226177"></script>
    <script src="module_crm.js?v=1784226177"></script>
    <script src="module_finance.js?v=1784226177"></script>
    <script src="module_vault.js?v=1784226177"></script>
    <script src="astraa_core.js?v=1784226177"></script>
    <script src="nexus_controller.js?v=1784226177"></script>
</body>
</html>
