<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="login.css">
    <title>Astraa | Portal Authentication</title>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>ASTRAA</h1>
            <p>SOVEREIGN OPERATING SYSTEM // GATEWAY</p>
        </div>
        <div id="login-toggle" style="display:flex;gap:8px;margin-bottom:16px;"><button type="button" id="tab-account" onclick="astraaSetLoginMode('account')" style="flex:1;padding:9px;border-radius:8px;border:1px solid #1d4ed8;background:#1d4ed8;color:#fff;font-weight:700;cursor:pointer;font-size:.82rem;">Account</button><button type="button" id="tab-user" onclick="astraaSetLoginMode('user')" style="flex:1;padding:9px;border-radius:8px;border:1px solid #334155;background:transparent;color:#94a3b8;font-weight:700;cursor:pointer;font-size:.82rem;">Team Member</button></div><form id="login-form">
            <div class="input-group">
                <label for="username">Operator ID / Email</label>
                <input type="text" id="username" placeholder="you@company.com" required>
            </div>
            <div class="input-group">
                <label for="password">Passkey</label>
                <input type="password" id="password" placeholder="••••••••••••" required>
            </div>
            <button type="submit" class="cta-button">Initialize Session</button>
        </form>
        <div id="auth-status"></div>
    </div>
    <script>window.ASTRAA_API_BASE = "https://family-speed-outcome.ngrok-free.dev";</script>
    <script src="auth.js"></script>
</body>
</html>
