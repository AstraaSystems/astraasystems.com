<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astraa Systems | Custom Architecture</title>
  <style>
    :root {
      --black: #03050a;
      --white: #ffffff;
      --off-white: #f8fafc;
      --line-light: #e2e8f0;
      --royal: #1d4ed8;
      --text-dark: #0f172a;
      --muted-dark: #475569;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, sans-serif; color: var(--text-dark); background: var(--white); line-height: 1.5; }
    a { text-decoration: none; color: inherit; }

    /* STICKY HEADER V8 */
    .astraa-site-header {
      position: sticky !important; top: 0 !important; z-index: 9999 !important;
      background: rgba(255, 255, 255, 0.85) !important; backdrop-filter: blur(16px) !important;
      border-bottom: 1px solid var(--line-light) !important;
    }
    .astraa-site-nav {
      max-width: 1200px !important; margin: 0 auto !important; padding: 14px 24px !important;
      display: flex !important; justify-content: space-between !important; align-items: center !important; gap: 20px !important;
    }
    .astraa-site-brand { display: flex !important; align-items: center !important; gap: 12px !important; font-weight: 950 !important; color: var(--black) !important; }
    .astraa-site-brand img { width: 34px !important; height: 34px !important; object-fit: contain !important; }
    .astraa-site-brand span { font-size: 13px !important; font-weight: 800 !important; }
    .astraa-site-links { display: flex !important; align-items: center !important; gap: 28px !important; color: var(--muted-dark) !important; font-size: 14px !important; font-weight: 600 !important; }
    .astraa-site-cta { display: inline-flex !important; padding: 8px 16px !important; border-radius: 999px !important; background: var(--black) !important; color: white !important; font-weight: 700 !important; font-size: 13px !important; }
    @media(max-width: 900px) { .astraa-site-links { display: none !important; } }

    .contact-container { max-width: 600px; margin: 60px auto 90px; padding: 0 24px; }
    .contact-form-card { background: var(--white); border: 1px solid var(--line-light); padding: 40px; border-radius: 16px; }
    .contact-form-card h1 { font-size: 28px; font-weight: 900; margin-bottom: 8px; letter-spacing: -0.03em; color: var(--black); }
    .contact-form-card p { color: var(--muted-dark); font-size: 14px; margin-bottom: 32px; }

    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
    .form-group label { font-size: 13px; font-weight: 750; color: var(--text-dark); }
    .form-group input, .form-group textarea { padding: 12px 16px; border: 1px solid var(--line-light); border-radius: 8px; font-size: 14px; background: var(--off-white); width: 100%; font-family: inherit; }
    .form-group textarea { resize: vertical; min-height: 120px; }
    .submit-btn { display: inline-flex; justify-content: center; align-items: center; width: 100%; padding: 14px; border-radius: 8px; background: var(--black); color: white; font-weight: 700; border: none; cursor: pointer; font-size: 14px; }
    .submit-btn:hover { background: var(--royal); }

    footer { text-align: center; color: var(--muted-dark); font-size: 14px; padding: 32px 0; border-top: 1px solid var(--line-light); }
  </style>
</head>
<body>

  <header class="astraa-site-header">
    <nav class="astraa-site-nav">
      <a href="index.html" class="astraa-site-brand">
        <img src="assets/images/astraa_logo.png" alt="Astraa Systems logo" onerror="this.style.display='none'"/>
        <span>Astraa Systems</span>
      </a>
      
      <div class="astraa-site-links">
        <a href="index.html">Home</a>
        <a href="tools.html">Tools</a>
        <a href="pricing.html">Pricing</a>
        <a href="faq.html">FAQ / Support</a>
        <a href="contact.html">Custom Packages</a>
      </div>

      <div class="astraa-action-pack">
        <a href="astraaspace/login.html" class="astraa-space-btn">Astraa Space</a>
        <a class="astraa-site-cta" href="buynow.html">Buy Now</a>
      </div>
    </nav>
  </header>

  <main class="contact-container">
    <div class="contact-form-card">
      <h1>Custom Parameters</h1>
      <p>Submit your expected cluster scales, and our systems engineering group will compile a deployment spec.</p>
      <form onsubmit="return false;">
        <div class="form-group">
          <label>Company Identity</label>
          <input type="text" placeholder="Enterprise Identity" required>
        </div>
        <div class="form-group">
          <label>Engineering Contact Email</label>
          <input type="email" placeholder="dev@company.com" required>
        </div>
        <div class="form-group">
          <label>Target Parameters</label>
          <textarea placeholder="Outline your concurrent requirements or pipeline parameters..."></textarea>
        </div>
        <button type="submit" class="submit-btn">Transmit Specifications</button>
      </form>
    </div>
  </main>

  <footer>
    <div style="display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto; flex-wrap: wrap; gap: 16px;">
      <p>&copy; 2026 Astraa Systems. All rights reserved.</p>
      <a href="astraaspace/login.html" style="font-size: 14px; font-weight: 600; color: #475569; text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='#1d4ed8'" onmouseout="this.style.color='#475569'">Astraa Space</a>
    </div>
  </footer>
</body>
</html>
