<!DOCTYPE html>
<!-- ASTRAA_PUBLIC_MARKETING_METADATA_V1_START -->
<title>Contact Astraa Systems | Custom Infrastructure Requirements</title>
<meta name="description" content="Connect with Astraa core architectural support engineers to request dedicated high-throughput pipeline parameters.">
<meta property="og:title" content="Contact Astraa Systems | Custom Architecture">
<meta property="og:description" content="Connect with Astraa core architectural support engineers to request custom enterprise parameters.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Astraa Systems">
<meta property="og:url" content="https://astraasystems.com/contact.html">
<link rel="canonical" href="https://astraasystems.com/contact.html">
<!-- ASTRAA_PUBLIC_MARKETING_METADATA_V1_END -->

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --black: #03050a;
      --navy: #090d16;
      --royal: #1d4ed8;
      --blue: #2563eb;
      --white: #ffffff;
      --off-white: #f8fafc;
      --line-light: #e2e8f0;
      --text-dark: #0f172a;
      --muted-dark: #475569;
      --gray: #64748b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-dark);
      background: var(--white);
      line-height: 1.5;
    }

    a { color: inherit; text-decoration: none; }

    /* ASTRAA_VISIBLE_PUBLIC_HEADER_V8 */
    .astraa-site-header {
      position: sticky !important;
      top: 0 !important;
      z-index: 9999 !important;
      background: rgba(255, 255, 255, 0.85) !important;
      backdrop-filter: blur(16px) !important;
      border-bottom: 1px solid var(--line-light) !important;
    }

    .astraa-site-nav {
      max-width: 1200px !important;
      margin: 0 auto !important;
      padding: 14px 24px !important;
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      gap: 20px !important;
    }

    .astraa-site-brand {
      display: flex !important;
      align-items: center !important;
      gap: 12px !important;
      font-weight: 950 !important;
      color: var(--black) !important;
      white-space: nowrap !important;
    }

    .astraa-site-brand img { width: 34px !important; height: 34px !important; object-fit: contain !important; }
    .astraa-site-brand span { display: block !important; font-size: 13px !important; color: var(--black) !important; font-weight: 800 !important; }

    .astraa-site-links { display: flex !important; align-items: center !important; gap: 28px !important; color: var(--muted-dark) !important; font-size: 14px !important; font-weight: 600 !important; }
    .astraa-site-links a:hover { color: var(--royal) !important; }

    .astraa-site-cta {
      display: inline-flex !important;
      padding: 8px 16px !important;
      border-radius: 999px !important;
      background: var(--black) !important;
      color: white !important;
      font-weight: 700 !important;
      font-size: 13px !important;
    }
    .astraa-site-cta:hover { background: var(--royal) !important; }

    @media(max-width: 900px) { .astraa-site-links { display: none !important; } }

    .contact-container { max-width: 600px; margin: 60px auto 90px; padding: 0 24px; }
    .contact-form-card { background: var(--white); border: 1px solid var(--line-light); padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
    
    .contact-form-card h1 { font-size: 28px; font-weight: 900; margin: 0 0 8px; letter-spacing: -0.03em; color: var(--black); }
    .contact-form-card p { color: var(--muted-dark); font-size: 14px; margin: 0 0 32px; }

    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
    .form-group label { font-size: 13px; font-weight: 750; color: var(--text-dark); }
    .form-group input, .form-group textarea { padding: 12px 16px; border: 1px solid var(--line-light); border-radius: 8px; font-size: 14px; background: var(--off-white); width: 100%; font-family: inherit; }
    .form-group textarea { resize: vertical; min-height: 120px; }

    .submit-btn { display: inline-flex; justify-content: center; align-items: center; width: 100%; padding: 14px; border-radius: 8px; background: var(--black); color: white; font-weight: 700; border: none; cursor: pointer; font-size: 14px; transition: background 0.2s; }
    .submit-btn:hover { background: var(--royal); }

    footer { text-align: center; color: var(--gray); font-size: 14px; padding: 32px 0; border-top: 1px solid var(--line-light); }
  </style>
</head>
<body>

  <header class="astraa-site-header">
    <nav class="astraa-site-nav">
      <a href="/index.html" class="astraa-site-brand">
        <img src="/assets/images/astraa_logo.png" alt="Astraa Systems logo" />
        <span>Astraa Systems</span>
      </a>
      <div class="astraa-site-links">
        <a href="/index.html">Home</a>
        <a href="/tools.html">Tools</a>
        <a href="/pricing.html">Pricing</a>
        <a href="/faq.html">FAQ / Support</a>
        <a href="/contact.html">Custom Packages</a>
        <a href="/buynow.html" class="astraa-site-cta">Buy Now</a>
      </div>
    </nav>
  </header>

  <main class="contact-container">
    <div class="contact-form-card">
      <h1>Custom Cluster Parameters</h1>
      <p>Submit your anticipated scale metrics, and our systems engineers will build out an individual tenant provisioning manifest.</p>
      
      <form onsubmit="return false;">
        <div class="form-group">
          <label>Company Identity</label>
          <input type="text" placeholder="Enterprise Name" required>
        </div>
        <div class="form-group">
          <label>Engineering Contact Email</label>
          <input type="email" placeholder="lead@company.com" required>
        </div>
        <div class="form-group">
          <label>Target Infrastructure Parameters</label>
          <textarea placeholder="Outline your anticipated concurrent node runtime specs, databases, or local isolation parameters..."></textarea>
        </div>
        <button type="submit" class="submit-btn">Transmit Specifications</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Astraa Systems. All rights reserved.</p>
  </footer>

</body>
</html>
