<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=workspace-test-login.html" />
  <title>Astraa Workspace Locked</title>
  <script>
    window.location.replace("workspace-test-login.html");
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #050816;
      color: #fff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 520px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.08);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 10px; }
    p { color: #b9c2d8; line-height: 1.6; }
    a {
      display: inline-flex;
      margin-top: 12px;
      padding: 11px 15px;
      border-radius: 999px;
      background: linear-gradient(135deg, #36e4ff, #43f0a3);
      color: #03101f;
      text-decoration: none;
      font-weight: 900;
    }
  </style>

<style id="astraa-tools-v1-refinement-style">
/* Astraa Tools v1 refinement
   Fixes spacing/readability and reframes Finance/Operations as tool testing grounds.
   Does not touch Moneris/payment files.
*/

.astraa-tools-v1 {
  max-width: 1240px !important;
  margin: 44px auto !important;
  padding: 0 24px 72px !important;
}

.astraa-tools-v1-header {
  background: #0f172a !important;
  border: 1px solid rgba(54, 228, 255, 0.20) !important;
  border-radius: 28px !important;
  padding: 28px !important;
  box-shadow: 0 24px 70px rgba(15, 23, 42, 0.28) !important;
}

.astraa-tools-v1 h2 {
  color: #ffffff !important;
  -webkit-text-fill-color: #ffffff !important;
  font-size: clamp(32px, 4vw, 52px) !important;
}

.astraa-tools-v1-subtitle {
  color: #dbeafe !important;
  -webkit-text-fill-color: #dbeafe !important;
  font-size: 16px !important;
}

.astraa-tool-grid-v1 {
  grid-template-columns: 1fr !important;
  gap: 26px !important;
  margin-top: 26px !important;
}

.astraa-tool-panel-v1 {
  padding: 28px !important;
  border-radius: 28px !important;
  color: #0f172a !important;
  -webkit-text-fill-color: #0f172a !important;
}

.astraa-tool-panel-v1 h3 {
  font-size: 28px !important;
  color: #020617 !important;
  -webkit-text-fill-color: #020617 !important;
}

.astraa-tool-panel-v1 p,
.astraa-tool-panel-v1 label,
.astraa-tool-panel-v1 span,
.astraa-tool-panel-v1 small,
.astraa-tool-panel-v1 div {
  color: #0f172a !important;
  -webkit-text-fill-color: #0f172a !important;
}

.astraa-tool-panel-v1 p {
  color: #334155 !important;
  -webkit-text-fill-color: #334155 !important;
  font-size: 15px !important;
}

.astraa-field-row-v1 {
  grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
  gap: 14px !important;
}

.astraa-action-row-v1 {
  margin-top: 18px !important;
  gap: 12px !important;
}

.astraa-output-v1 {
  margin-top: 20px !important;
}

.astraa-metric-v1 {
  font-size: 15px !important;
}

.astraa-function-map-v1 {
  margin: 18px 0 22px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.astraa-function-card-v1 {
  background: #f8fafc;
  border: 1px solid #dbe3ef;
  border-radius: 18px;
  padding: 16px;
  color: #0f172a;
}

.astraa-function-card-v1 h4 {
  margin: 0 0 8px;
  color: #020617 !important;
  -webkit-text-fill-color: #020617 !important;
  font-size: 16px;
}

.astraa-function-card-v1 p {
  margin: 0 0 8px;
  color: #334155 !important;
  -webkit-text-fill-color: #334155 !important;
  line-height: 1.5;
}

.astraa-function-card-v1 .future {
  color: #92400e !important;
  -webkit-text-fill-color: #92400e !important;
  background: #fffbeb;
  border: 1px solid #fbbf24;
  border-radius: 12px;
  padding: 8px 10px;
  font-size: 13px;
}

.astraa-tool-section-label-v1 {
  margin: 22px 0 10px;
  font-weight: 900;
  color: #020617 !important;
  -webkit-text-fill-color: #020617 !important;
  font-size: 15px;
  text-transform: uppercase;
  letter-spacing: .04em;
}

@media (max-width: 900px) {
  .astraa-field-row-v1,
  .astraa-function-map-v1 {
    grid-template-columns: 1fr !important;
  }
}
</style>

</head>
<body>
  <main class="card">
    <h1>Astraa Workspace is locked</h1>
    <p>Workspace access is currently restricted for internal testing.</p>
    <a href="workspace-test-login.html">Go to Workspace Test Login</a>
  </main>
</body>
</html>
