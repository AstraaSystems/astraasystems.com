    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid #e5e7eb;
    }

    .nav {
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;

    }

    .brand {

      gap: 12px;
      text-decoration: none;
      font-weight: 950;
      color: var(--black, #05070f);
    }

    .brand img {
      width: 38px;
      height: 38px;

      font-weight: 700;
      line-height: 1.1;

      align-items: center;
      gap: 22px;
      color: var(--muted, #475569);
      font-size: 14px;
      font-weight: 750;
    }

    .links a {
      text-decoration: none;
    }

    .links a:hover {
      color: var(--royal, #1d4ed8);
    }

    .cta {
      display: inline-flex;
      padding: 10px 15px;
      border-radius: 999px;
      background: var(--royal, #1d4ed8);
      color: white;
      text-decoration: none;
      font-weight: 900;
    }

    @media(max-width: 900px) {
      .links {
        display: none;
      }
