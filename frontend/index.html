<!DOCTYPE html>
<html>
<head>
  <title>Astraa Systems</title>
</head>

<body style="background:#0b1220; color:white; font-family:Arial;">

<h1 style="text-align:center;">One system to run your business</h1>

<p style="text-align:center;">
No complexity. No fragmentation. No guesswork.
</p>

<h2>Your Data Stays Yours. Always.</h2>

<p>
We do not store or share your data without permission.
</p>

<h2>Estimator</h2>

<button onclick="runEstimate()">Run Estimate</button>

<div id="result"></div>

<h2>Contact</h2>
<p>contact@astraasystems.com</p>

<script>

async function runEstimate() {

  let res = await fetch("https://family-speed-outcome.ngrok-free.dev/estimate", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-API-KEY": "astraa_secure"
    },
    body: JSON.stringify({
      sqft: 10000,
      material: 1.1,
      labor: 1.05,
      complexity: 0.8
    })
  });

  let data = await res.json();

  document.getElementById("result").innerHTML =
    "Estimated Cost: $" + Math.round(data.base_estimate) +
    "<br><br>This is a baseline estimate. We can tailor this to your workflow.";
}

</script>

</body>
</html>
