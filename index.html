<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <title>Astraa OS</title>
</head>
<body>
    <div id="nexus-overlay" style="display:none; position:fixed; top:20%; left:25%; width:50%; background:rgba(15, 23, 42, 0.95); border:1px solid #3b82f6; padding:20px; border-radius:12px; z-index:1000;">
        <input type="text" id="nexus-input" placeholder="Nexus Command..." style="width:100%; background:transparent; border:none; color:white; font-size:1.5em; outline:none;">
    </div>
    <div style="display:flex;">
        <div id="sidebar">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 style="margin:0;">Astraa OS</h2>
                <button onclick="logoutAstraa()" style="background:transparent; border:none; color:#ef4444; cursor:pointer; font-size:0.8rem;">LOGOUT</button>
            </div>
            <div id="nav-list"></div>
        </div>
        <div id="main">
            <h1 id="welcome-title"></h1>
            <p id="welcome-subtitle"></p>
            <div id="content-area"></div>
        </div>
    </div>
    <script src="astraa_blueprint.js"></script>
    <script src="dashboard_overview.js"></script>
    <script src="module_commerce.js"></script>
    <script src="auth.js"></script>
    <script src="astraa_core.js"></script>
    <script src="nexus_controller.js"></script>
</body>
</html>
