<!DOCTYPE html>
<html>
<head>
  <title>Astraa Systems</title>
</head>

<body style="margin:0; font-family:Arial; background:#0b1220; color:#fff; text-align:center;">

<h1>Run your business without complexity.</h1>

<p>
Astraa Systems simplifies operations, finances, and workflows into one intelligent system.
</p>

<hr>

<h2>Astraa Estimator</h2>

<p>This is a baseline estimation tool. We tailor it to your workflow.</p>

<button onclick="runEstimate()" style="padding:10px 20px;">
  Run Estimate
</button>

<div id="result" style="margin-top:20px;"></div>

<hr>

<h2>Let’s build your system</h2>

<p>Email: contact@astraasystems.com</p>

<script>

async function runEstimate() {
  try {

    let res = await fetch("https://family-speed-outcome.ngrok-free.dev/estimate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-API-KEY": "astraa_secure"
      },
      body: JSON.stringify({
        sqft: 10000,
        material: 1.1,
        labor: 1.05,
        complexity: 0.8
      })
    });

    let data = await res.json();

    document.getElementById("result").innerHTML =
      "Estimated Cost: $" + Math.round(data.base_estimate);

  } catch (error) {
    console.error(error);
    document.getElementById("result").innerHTML =
      "Error connecting to estimator.";
  }
}

</script>

</body>
</html>
