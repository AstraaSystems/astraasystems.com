<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astraa Systems | Smart Business Automation</title>

    <style>
        .status-msg { margin: 10px; padding: 10px; border-radius: 5px; display: none; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>

<body>

<header>
    <h1>Astraa Systems</h1>
    <p>Smart Solutions for Modern Businesses</p>
</header>

<section class="payment-box">
    <h3>Secure Payment Portal</h3>
    <div id="statusBox" class="status-msg"></div>

    <iframe 
        id="monerisFrame"
        src="https://esqa.moneris.com/HPPtoken/index.php?id=htFTMQ8J63EYNZS&pmmsg=true&css_body=background:white;&css_textbox=border-width:1px;&css_textbox_pan=width:160px;&enable_exp=1&css_textbox_exp=width:40px;&enable_cvd=1&css_textbox_cvd=width:40px;&enable_exp_formatting=1&enable_cc_formatting=1"
        style="width: 100%; height: 280px; border: none;">
    </iframe>

    <p style="font-size: 12px; color: #666;">Payments secured by Astraa Financial Engine</p>
</section>

<footer>
    <p>© 2026 Astraa Systems. All rights reserved.</p>
</footer>

<script>
window.addEventListener("message", function(e) {
    if (!e.origin.includes("moneris.com")) return;

    try {
        const respData = JSON.parse(e.data);
        const statusBox = document.getElementById("statusBox");

        if (respData.responseCode === "001" || respData.responseCode.startsWith("0")) {
            statusBox.className = "status-msg success";
            statusBox.innerHTML = "Secure Token Generated. Processing...";
            statusBox.style.display = "block";

            fetch("http://YOUR_BACKEND_IP:8000/moneris/token-receiver", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    payment_token: respData.dataKey,
                    plan: "professional",
                    amount: "49.00",
                    email: "client@example.com"
                })
            })
            .then(res => res.json())
            .then(data => {
                statusBox.innerHTML = "Subscription Activated!";
            })
            .catch(err => {
                statusBox.className = "status-msg error";
                statusBox.innerHTML = "Engine Connection Error.";
            });

        } else {
            statusBox.className = "status-msg error";
            statusBox.innerHTML = "Invalid Card Details: " + respData.responseCode;
            statusBox.style.display = "block";
        }
    } catch (err) {
        console.error("Payload Error:", err);
    }
}, false);
</script>

</body>
</html>
