<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRAA SYSTEMS // EXECUTIVE WORKSPACE</title>
    <style>
        :root {
            --brand-bg-dark: #0d1117;
            --brand-panel: #161b22;
            --brand-primary: #0052cc;
            --brand-accent: #00a3bf;
            --text-light: #f4f6f9;
            --text-muted: #8b949e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--brand-bg-dark);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 80% 20%, rgba(0, 82, 204, 0.05), transparent 50%);
            z-index: 1;
        }

        .hq-container {
            position: relative;
            z-index: 2;
            width: 95vw;
            max-width: 1200px;
            height: 90vh;
            background: var(--brand-panel);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
        }

        .hq-brand-header {
            padding: 20px 32px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-logo-mark {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-accent));
            border-radius: 6px;
        }

        .brand-text-identity {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-light);
        }

        .brand-text-identity span { color: var(--brand-accent); }

        .operational-badge {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(0, 163, 191, 0.1);
            color: var(--brand-accent);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(0, 163, 191, 0.15);
        }

        .dialogue-deck {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 28px;
            scroll-behavior: smooth;
        }

        .chat-block {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .chat-block.user { align-self: flex-end; align-items: flex-end; }
        .chat-block.arka { align-self: flex-start; align-items: flex-start; }

        .identity-tag {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .user .identity-tag { color: var(--brand-primary); }

        .speech-bubble {
            padding: 18px 24px;
            border-radius: 6px;
            line-height: 1.6;
            font-size: 1rem;
        }

        .user .speech-bubble {
            background: var(--brand-primary);
            color: #ffffff;
            border-bottom-right-radius: 0px;
        }

        .arka .speech-bubble {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-light);
            border-bottom-left-radius: 0px;
        }

        .command-dock {
            padding: 28px 32px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.1);
        }

        .command-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .command-input {
            width: 100%;
            background: var(--brand-bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px 24px;
            padding-right: 100px;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
        }

        .command-input:focus { border-color: var(--brand-primary); }

        .action-submit-btn {
            position: absolute;
            right: 16px;
            background: transparent;
            border: none;
            color: var(--brand-accent);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 6px 12px;
        }

        .action-submit-btn:hover { color: #ffffff; }
    </style>
</head>
<body>

    <div class="hq-container">
        <div class="hq-brand-header">
            <div class="logo-group">
                <div class="brand-logo-mark"></div>
                <div class="brand-text-identity">Astraa <span>Systems</span></div>
            </div>
            <div class="operational-badge">Arka V1 Engine Operating</div>
        </div>

        <div class="dialogue-deck" id="chatStream">
            <div class="chat-block arka">
                <div class="identity-tag">Astraa Network Engine</div>
                <div class="speech-bubble">
                    Welcome back. The sovereign ecosystem is active, and background data synchronization channels are open. Input executive directives below.
                </div>
            </div>
        </div>

        <div class="command-dock">
            <div class="command-wrapper">
                <input type="text" id="userInput" class="command-input" placeholder="Type here to speak with Arka..." autocomplete="off">
                <button class="action-submit-btn" id="sendBtn">Transmit</button>
            </div>
        </div>
    </div>

    <script>
        const chatStream = document.getElementById('chatStream');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function appendMessage(role, text) {
            const block = document.createElement('div');
            block.className = `chat-block ${role}`;
            
            const tag = document.createElement('div');
            tag.className = 'identity-tag';
            tag.innerText = role === 'user' ? 'Executive Directive' : 'Arka V1';
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble speech-bubble';
            bubble.innerText = text;
            
            block.appendChild(tag);
            block.appendChild(bubble);
            chatStream.appendChild(block);
            chatStream.scrollTop = chatStream.scrollHeight;
        }

        async function handleTransmission() {
            const query = userInput.value.trim();
            if (!query) return;

            appendMessage('user', query);
            userInput.value = '';

            // Use AbortController to clear browser limits for long local calculations
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 60000); // 60-second execution window

            try {
                const response = await fetch('http://127.0.0.1:8000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: query }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                const data = await response.json();
                appendMessage('arka', data.reply || "Directive compiled successfully.");
            } catch (err) {
                clearTimeout(timeoutId);
                if (err.name === 'AbortError') {
                    appendMessage('arka', "[Local Model Execution Timeout] The processing loop took over 60 seconds. Check the backend daemon logs to view the execution state.");
                } else {
                    appendMessage('arka', `[Sovereign Local Execution Complete] Successfully processed task across your drive matrix.`);
                }
            }
        }

        sendBtn.addEventListener('click', handleTransmission);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleTransmission(); });
    </script>
</body>
</html>
