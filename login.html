<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astraa Systems — Login</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<nav class="nav">
  <div class="container nav-inner">
    <a class="brand" href="/index.html">
      <img src="/assets/images/astraa_logo.png" alt="Astraa Systems logo" />
      Astraa Systems
    </a>
    <div class="nav-links">
      <a href="/index.html">Home</a>
      <a href="/tools.html">Tools</a>
      <a href="/pricing.html">Pricing</a>
      <a href="/faq.html">FAQ / Support</a>
      <a href="/astraaspace/login.html">Astraa Space</a>
      <a href="/contact.html">Custom Packages</a>
      <a class="nav-cta" href="/register.html">Register</a>
    </div>
  </div>
</nav>

<main class="page">
  <div class="container layout" style="max-width: 480px; margin: 40px auto; padding: 0 20px;">
    <section class="card" style="background: #ffffff; border: 1px solid #e2e8f0; padding: 32px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
      <h2 style="font-size: 24px; font-weight: 700; margin-bottom: 8px; color: #0f172a;">Astraa Access</h2>
      <p style="color: #64748b; font-size: 14px; margin-bottom: 24px;">Log in to access your custom workspaces, tools, and business operations platforms.</p>
      
      <form style="display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 14px; font-weight: 600; color: #334155;">Email</label>
          <input type="email" placeholder="you@example.com" style="padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; width: 100%; box-sizing: border-box;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 14px; font-weight: 600; color: #334155;">Password</label>
          <input type="password" placeholder="Password" style="padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; width: 100%; box-sizing: border-box;">
        </div>
        <button type="submit" style="background: #6366f1; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 8px;">Login</button>
      </form>
    </section>
  </div>
</main>

</body>
</html>
