<!DOCTYPE html>
<html lang="en">
<head>

<title>Astraa Space — Back Soon</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;

<body>
  <div class="box">
    assets/images/astraa_logo.png
    <h1>We'll be right back</h1>

    </p>

      The rest of our website is still available while we finish up.
