<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astraa Checkout</title>
</head>
<body>

<div id="outerDiv" style="width:100%; max-width:400px; min-height:300px; margin: 40px auto; border: 1px dashed #2563eb;">
    <div id="monerisCheckout"></div>
</div>

<script src="https://gateway.moneris.com/chkt/js/chkt_v1.00.js"></script>
<script>
(function () {
    const MY_CHECKOUT_ID = "chktSPVV793136";

    console.log("[Astraa] Initializing Pure Client Checkout ID Flow...");

    var myCheckout = new monerisCheckout();
    myCheckout.setMode("prod");
    myCheckout.setCheckoutDiv("monerisCheckout");

    myCheckout.setCallback("page_loaded", function(resp) { console.log("[Astraa] Form mounted successfully."); });
    myCheckout.setCallback("cancel_transaction", function(resp) { console.log("[Astraa] Cancelled"); });
    myCheckout.setCallback("error_event", function(resp) { console.error("[Astraa] Moneris Error:", resp); });
    
    myCheckout.setCallback("payment_complete", function(resp) {
        var parsed = JSON.parse(resp);
        window.location.href = "payment-success.html?ticket=" + encodeURIComponent(parsed.ticket || "");
    });

    window.startAstraaCheckout = function() {
        // Strict minimal structure for pure frontend checkout configurations
        var preloadData = {
            "checkout_id": MY_CHECKOUT_ID,
            "amount": "29.00",
            "cart": {
                "items": [{
                    "description": "Astraa Subscription",
                    "quantity": "1",
                    "price": "29.00"
                }]
            }
        };

        try {
            console.log("[Astraa] Spawning hosted checkout window...");
            myCheckout.startCheckout(JSON.stringify(preloadData));
        } catch(e) {
            console.error("[Astraa] Runtime crash:", e);
        }
    };

    if (document.readyState === "complete") {
        setTimeout(window.startAstraaCheckout, 300);
    } else {
        window.addEventListener("load", function() { setTimeout(window.startAstraaCheckout, 300); });
    }
})();
</script>

</body>
</html>
