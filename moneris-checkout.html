<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astraa Checkout</title>
</head>
<body>

<div id="outerDiv" style="width:100%; max-width:400px; min-height:450px; margin: 40px auto; border: 1px dashed #2563eb;">
    <div id="monerisCheckout"></div>
</div>

<script src="https://gateway.moneris.com/chkt/js/chkt_v1.00.js"></script>
<script>
(function () {
    console.log("[Astraa] Initializing Moneris Secure Ticket Flow...");

    var myCheckout = new monerisCheckout();
    myCheckout.setMode("prod");
    myCheckout.setCheckoutDiv("monerisCheckout");

    // Configure lifecycle hooks
    myCheckout.setCallback("page_loaded", function(resp) { console.log("[Astraa] Canvas mounted."); });
    myCheckout.setCallback("cancel_transaction", function(resp) { console.log("[Astraa] User Cancelled."); });
    myCheckout.setCallback("error_event", function(resp) { console.error("[Astraa] Moneris Error:", resp); });
    
    myCheckout.setCallback("payment_complete", function(resp) {
        var parsed = JSON.parse(resp);
        window.location.href = "payment-success.html?ticket=" + encodeURIComponent(parsed.ticket || "");
    });

    window.startAstraaCheckout = function() {
        // NOTE: Replace this placeholder string with the real ticket string generated by your backend server API!
        var serverGeneratedTicket = "PASTE_YOUR_MONERIS_TICKET_HERE";

        try {
            console.log("[Astraa] Injecting payment frame for ticket:", serverGeneratedTicket);
            // Pass the single string token directly to Moneris
            myCheckout.startCheckout(serverGeneratedTicket);
        } catch(e) {
            console.error("[Astraa] Initialization failed:", e);
        }
    };

    if (document.readyState === "complete") {
        setTimeout(window.startAstraaCheckout, 300);
    } else {
        window.addEventListener("load", function() { setTimeout(window.startAstraaCheckout, 300); });
    }
})();
</script>

</body>
</html>
