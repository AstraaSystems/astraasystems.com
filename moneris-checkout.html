
<!-- ASTRAA_MONERIS_CHECKOUT_ID_COMPAT_V1 -->

<div id="outerDiv" style="width:100%; max-width:400px; min-height:300px; margin: 0 auto;">

  <div id="monerisCheckout"></div>

</div>



<!-- Load Moneris SDK -->

<script src="https://gateway.moneris.com/chkt/js/chkt_v1.00.js"></script>



<script>

(function () {

  // Replace this placeholder with your actual Moneris Checkout ID string

  const MY_CHECKOUT_ID = "chktSPVV793136";

  

  // Set to "qa" for sandbox testing, or "prod" for live transactions

  const ENVIRONMENT_MODE = "qa"; 



  var myCheckout = new monerisCheckout();

  myCheckout.setMode(ENVIRONMENT_MODE);

  myCheckout.setCheckoutDiv("monerisCheckout");



  // Define Callback Functions

  function myPageLoad(response) {

    console.log("[Moneris] Page Loaded:", JSON.parse(response));

  }



  function myCancelTransaction(response) {

    console.log("[Moneris] Transaction Cancelled:", JSON.parse(response));

  }



  function myErrorEvent(response) {

    console.error("[Moneris] Error Event:", JSON.parse(response));

  }



  function myPaymentReceipt(response) {

    console.log("[Moneris] Payment Receipt Received:", JSON.parse(response));

  }



  function myPaymentComplete(response) {

    console.log("[Moneris] Payment Complete:", JSON.parse(response));

    const parsed = JSON.parse(response);

    window.location.href = "payment-success.html?ticket=" + encodeURIComponent(parsed.ticket || "");

  }



  // Register Callbacks

  myCheckout.setCallback("page_loaded", myPageLoad);

  myCheckout.setCallback("cancel_transaction", myCancelTransaction);

  myCheckout.setCallback("error_event", myErrorEvent);

  myCheckout.setCallback("payment_receipt", myPaymentReceipt);

  myCheckout.setCallback("payment_complete", myPaymentComplete);



  // Global trigger function to launch checkout using the Checkout ID

  window.startAstraaCheckout = function() {

    // Basic structural data required by Moneris when initializing via Checkout ID

    var preloadData = {

      "amount": "29.00",

      "cart": {

        "items": [

          {

            "description": "Astraa System Subscription",

            "quantity": "1",

            "price": "29.00"

          }

        ]

      }

    };



    console.log("[Moneris] Starting checkout with ID...");

    // Crucial: Must use startCheckoutWithCheckoutId when passing a Checkout ID!

    myCheckout.startCheckoutWithCheckoutId(MY_CHECKOUT_ID, JSON.stringify(preloadData));

  };



  // Automatically kick off checkout once everything is parsed

  document.addEventListener("DOMContentLoaded", function() {

    setTimeout(function() {

      window.startAstraaCheckout();

    }, 500);

  });

})();

</script>
