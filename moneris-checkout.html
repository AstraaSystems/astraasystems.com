<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Astraa Checkout</title>
</head>
<body>
<div id="outerDiv" style="width:100%; max-width:400px; min-height:300px; margin: 40px auto; border: 1px dashed #ccc;">
    <div id="monerisCheckout"></div>
</div>
<script src="https://gateway.moneris.com/chkt/js/chkt_v1.00.js"></script>
<script>
(function () {
    /* TOGGLE MODE HERE: Use "qa" for local testing, "prod" for live server */
    const IS_LOCAL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
    const ENVIRONMENT_MODE = IS_LOCAL ? "qa" : "prod";
    const MY_CHECKOUT_ID = "chktSPVV793136";
    
    console.log("[Astraa] Running in " + ENVIRONMENT_MODE + " mode.");
    
    var myCheckout = new monerisCheckout();
    myCheckout.setMode(ENVIRONMENT_MODE);
    myCheckout.setCheckoutDiv("monerisCheckout");
    myCheckout.setCallback("page_loaded", function(resp) { console.log("Loaded", JSON.parse(resp)); });
    myCheckout.setCallback("cancel_transaction", function(resp) { console.log("Cancelled", JSON.parse(resp)); });
    myCheckout.setCallback("error_event", function(resp) { console.error("Error", JSON.parse(resp)); });
    myCheckout.setCallback("payment_receipt", function(resp) { console.log("Receipt", JSON.parse(resp)); });
    myCheckout.setCallback("payment_complete", function(resp) {
        var parsed = JSON.parse(resp);
        window.location.href = "payment-success.html?ticket=" + encodeURIComponent(parsed.ticket || "");
    });
    window.startAstraaCheckout = function() {
        var preloadData = { "amount": "29.00", "cart": { "items": [{ "description": "Astraa Subscription", "quantity": "1", "price": "29.00" }] } };
        myCheckout.startCheckoutWithCheckoutId(MY_CHECKOUT_ID, JSON.stringify(preloadData));
    };
    document.addEventListener("DOMContentLoaded", function() { setTimeout(window.startAstraaCheckout, 300); });
})();
</script>
</body>
</html>
