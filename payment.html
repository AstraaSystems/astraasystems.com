<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Astraa Payment</title>
</head>

<body style="background:#0b1220; color:white; text-align:center; font-family:Arial;">

  <h1>Astraa Payment</h1>

  <input id="email" placeholder="Email" style="padding:10px; width:260px;"><br><br>

  <button onclick="startPayment()" style="padding:10px 20px;">Pay</button>

  <div id="status" style="margin-top:20px;"></div>

  <script>
    async function startPayment() {
      document.getElementById("status").innerHTML = "Preparing secure payment...";

      try {
        const res = await fetch("https://family-speed-outcome.ngrok-free.dev/start-payment", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-API-KEY": "astraa_secure"
          },
          body: JSON.stringify({
            email: document.getElementById("email").value
          })
        });

        const data = await res.json();

        if (data.status === "ready" && data.url) {
          window.location.href = data.url;
          return;
        }

        if (data.status === "needs_moneris_checkout_launch_url") {
          document.getElementById("status").innerHTML =
            "Checkout ID is loaded, but the exact Moneris Checkout launch URL has not been added yet.";
          console.log("Checkout ID:", data.checkout_id);
          return;
        }

        document.getElementById("status").innerHTML =
          data.message || "Could not start payment.";
      } catch (err) {
        console.error(err);
        document.getElementById("status").innerHTML = "Payment setup error.";
      }
    }
  </script>

</body>
</html>
