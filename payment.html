<!DOCTYPE html>
<html>
<head>
    <title>Astraa Payment</title>
</head>

<body style="background:#0b1220; color:white; text-align:center; font-family:Arial;">

<h1>Astraa Payment</h1>

<input id="email" placeholder="Email" style="padding:10px; width:250px;"><br><br>

<!-- ✅ MONERIS IFRAME (FIXED + IDENTIFIED) -->
<iframe
    id="monerisFrame"
    src="https://esqa.moneris.com/HPPtoken/index.php?id=htFKG32TPPP8GLQ"
    width="300"
    height="80"
    frameborder="0">
</iframe>

<br><br>

<button onclick="pay()" style="padding:10px 20px;">Pay</button>

<div id="status" style="margin-top:20px;"></div>

<script>

function pay() {
    document.getElementById("status").innerHTML = "Processing...";

    const frame = document.getElementById("monerisFrame");

    if (!frame || !frame.contentWindow) {
        document.getElementById("status").innerHTML = "❌ Payment frame not loaded";
        return;
    }

    frame.contentWindow.postMessage(
        "tokenize",
        "https://esqa.moneris.com"
    );
}

window.addEventListener("message", async function(event) {

    if (!event.origin.includes("moneris.com")) return;

    try {
        const response = JSON.parse(event.data);

        console.log("Moneris response:", response);

        if (response.dataKey) {

            document.getElementById("status").innerHTML =
                "✅ Token received — charging...";

            const res = await fetch(
                "https://family-speed-outcome.ngrok-free.dev/charge",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-API-KEY": "astraa_secure"
                    },
                    body: JSON.stringify({
                        token: response.dataKey,
                        email: document.getElementById("email").value
                    })
                }
            );

            const data = await res.json();

            document.getElementById("status").innerHTML =
                JSON.stringify(data);

        } else {
            document.getElementById("status").innerHTML =
                "❌ Token error: " + response.error;
        }

    } catch (err) {
        console.error(err);
        document.getElementById("status").innerHTML =
            "❌ Payment setup error";
    }
});

</script>

</body>
</html>
